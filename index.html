<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V3 Infratech Limited | Enterprise IT Infrastructure & Data Center Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --bg-surface: #0e131f;
            --bg-card: #141b2d;
            --brand-blue: #0042ec;
            --brand-blue-light: #2b6bfb;
            --accent-cyan: #00d2ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 210, 255, 0.4);
            --glow: 0 0 30px rgba(0, 66, 236, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 15% 20%, rgba(0, 66, 236, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 60%, rgba(0, 210, 255, 0.08) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 7%;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
        }

        .brand-logo-container {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
        }

        .logo-img-wrapper {
            background: #ffffff;
            padding: 6px 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 66, 236, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo-svg {
            height: 32px;
            width: auto;
            display: block;
        }

        .brand-text-group {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
            line-height: 1;
        }

        .brand-tagline {
            font-size: 0.68rem;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 4px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        nav a:hover {
            color: var(--text-main);
        }

        .nav-cta {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            color: var(--text-main) !important;
        }

        .nav-cta:hover {
            background: var(--brand-blue);
            border-color: var(--brand-blue);
            box-shadow: var(--glow);
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .menu-toggle span {
            width: 25px;
            height: 2px;
            background-color: var(--text-main);
            transition: 0.3s;
        }

        .hero {
            padding: 7rem 7% 5rem;
            max-width: 1280px;
            margin: 0 auto;
            text-align: center;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.2);
            color: var(--accent-cyan);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero h1 {
            font-size: 3.8rem;
            line-height: 1.15;
            font-weight: 800;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #ffffff 0%, #a5f3fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 820px;
            margin: 0 auto 2.5rem;
            font-weight: 400;
        }

        .hero-actions {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-bottom: 4rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-light));
            color: #fff;
            padding: 0.95rem 2.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: var(--glow);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(0, 66, 236, 0.45);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.95rem 2.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            max-width: 700px;
            margin: 0 auto;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
        }

        .stat-item h3 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-cyan);
        }

        .stat-item p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0;
        }

        .services {
            padding: 6rem 7%;
            max-width: 1280px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .service-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            transition: all 0.3s ease;
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            background: var(--bg-card);
        }

        .icon-box {
            width: 54px;
            height: 54px;
            background: rgba(0, 66, 236, 0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            color: var(--accent-cyan);
        }

        .service-card h3 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .service-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .social-proof {
            padding: 6rem 7%;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 1280px;
            margin: 0 auto;
        }

        .testimonial-card {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 12px;
        }

        .stars {
            color: #fbbf24;
            margin-bottom: 1rem;
        }

        .testimonial-card p {
            font-size: 0.98rem;
            color: var(--text-main);
